name: Job agent

on:
  schedule:
    - cron: "0 11 */3 * *"   # search every 3 days, 7:00 New York summer time (6:00 in winter)
    - cron: "30 */2 * * *"   # every 2 hours: your added links + cover letters
  repository_dispatch:
    # Sent from Notion the moment you tick "Cover Letter" on a row. The relay
    # that turns Notion's webhook into this call may pass the row's page id as
    # client_payload.page_id, and then only that row is handled.
    types: [notion-cover-letter]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: daily
        options: [daily, light, letters, quiet, replies, next, patterns, note, mailcheck]
      count:
        description: "Rows to move from Queue to Suggested (mode 'next')"
        default: "10"
      note:
        description: "Feedback for your profile page (mode 'note'); separate points with |"
        default: ""
      page:
        description: "One Notion page id (mode 'letters'); blank means every ticked row"
        default: ""
      dry_run:
        description: "Print what would change without writing to Notion"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "mode=letters" >> "$GITHUB_OUTPUT"
            echo "page=${{ github.event.client_payload.page_id }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "page=${{ inputs.page }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 */3 * *" ]; then
            # Repo variable SKIP_DAILY_UNTIL (YYYY-MM-DD): skip the daily search up to and including that date
            if [[ "$(date -u +%F)" < "${{ vars.SKIP_DAILY_UNTIL }}" || "$(date -u +%F)" = "${{ vars.SKIP_DAILY_UNTIL }}" ]]; then
              echo "Daily search skipped (SKIP_DAILY_UNTIL=${{ vars.SKIP_DAILY_UNTIL }})"
              echo "mode=light" >> "$GITHUB_OUTPUT"
            else
              echo "mode=daily" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=light" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTRHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PROFILE_PAGE_ID: ${{ secrets.NOTION_PROFILE_PAGE_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTE: ${{ inputs.note }}
        run: |
          python main.py --mode "${{ steps.mode.outputs.mode }}" \
            --count "${{ inputs.count || '10' }}" --note "$NOTE" \
            --page "${{ steps.mode.outputs.page }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Remember screened postings and emails already read
        # Light runs read replies to your applications, so their state is kept too.
        # A run that read nothing new changes nothing and commits nothing.
        if: contains(fromJSON('["daily", "light", "replies"]'), steps.mode.outputs.mode) && !inputs.dry_run
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Update agent state"
          # main may have moved while the run was going, and losing the state
          # means the next run pays to screen everything a second time.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || exit 1
          done
          exit 1
