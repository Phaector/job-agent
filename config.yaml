    - {company: Wolf & Badger, title: Brand Partnerships Associate, url: "https://apply.workable.com/wolfandbadger/j/60543C348E/"}
    - {company: CLO Virtual Fashion, title: 3D Design & Implementation Specialist, url: "https://jobs.lever.co/clovirtualfashion/9185e4c2-91d3-4d46-86e7-86e1b9eeebde"}
    - {company: Bold Metrics, title: Implementation Engineer, url: "https://job-boards.greenhouse.io/boldmetrics/jobs/4696097005"}
    - {company: Vivrelle, title: Associate, Showroom, url: "https://jobs.lever.co/vivrelle/1eea4f74-465b-42b4-b6be-a8420776cfd8"}
    - {company: AfterShip, title: Business Development Representative, url: "https://job-boards.greenhouse.io/aftership/jobs/6130764004"}
