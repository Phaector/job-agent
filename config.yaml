# =====================================================================
#  JOB AGENT CONFIGURATION
#  Edit this file to tune the agent. API keys never go here:
#  they live in GitHub Secrets (online) or a .env file (local testing).
# =====================================================================

models:
  screen: claude-haiku-4-5-20251001   # cheap first pass over every new posting
  deep: claude-sonnet-5               # full scoring, cover letters, pattern reports

# ---------------------------------------------------------------------
# NOTION: names of the properties in "DB Applications".
# The title property is detected automatically (yours is "Company").
# Optional properties (Why not, Track) are skipped if they don't exist.
# ---------------------------------------------------------------------
notion:
  properties:
    job_title: Job Title
    status: Status
    link: Reference Link
    website: Website            # the company's own site, used to read its brand colours
    type: Type
    location: Location          # select field
    score: Score                # number field
    date_found: Date Found
    deadline: Deadline
    salary: Salary              # number field in dollars: only filled for USD postings
    next_action: Next Action
    why_not: Why not            # optional text field: a few words when you mark "Not interested"
    track: Track                # optional select field: PR / Comms, Fashion business, Tech business, Fashion-tech, Wildcard
                                # (new options are created in Notion automatically the first time one is used)
  statuses:
    suggested: Suggested
    queue: Queue
    not_interested: Not interested
    # Statuses that count as "yes" when the agent learns your taste.
    # Rejected is included: you wanted it, the company said no.
    counts_as_yes: [To Apply, Applied, Interviewed, Offer, Accepted, Rejected]
  type_options:
    job: Job
    internship: Internship
  cover_letter_trigger: Cover Letter   # Next Action option that triggers a draft
  # A row with no link is filled in from the job description you paste under a
  # heading with one of these names in the row's page.
  posting_headings: [job description, job posting, vacancy, vacature]

# ---------------------------------------------------------------------
# COVER LETTERS. Tick "Cover Letter" under Next Action on a row and the
# agent writes the letter, renders it as a PDF on your own letterhead in
# the company's accent colour, attaches it to that row, and unticks the
# box. Tick it again to get a new version; the old text stays on the page.
# ---------------------------------------------------------------------
cover_letter:
  files_property: Cover Letter    # Files & media property the PDF is attached to
  # Headings in a row's page under which YOUR OWN notes live. Everything
  # until the next heading is read as your material: both the content and
  # any instruction to the writer ("say I'm open to other entry-level roles").
  # Matched loosely, because the heading is rarely written the same way twice.
  draft_headings: [cover letter, my letter, my draft, my notes, motivation, motivatie, sollicitatie]
  # Headings the agent writes itself. Never read back as her voice, whatever
  # the list above says, or a letter ends up rewriting its own prose.
  agent_headings: [cover letter draft 1, cover letter draft 2, cover letter draft 3,
                   cover letter draft 4, cover letter draft 5, "(claude)", job agent notes,
                   why it fits, what the role really needs, gaps, details,
                   put these cv points first, answer these yourself, from your own notes,
                   resume changes, fit]
  keep_old_versions: true         # a new letter is added below the old one, never over it
  sender:                         # printed on the letterhead; empty lines are left out
    name: Phaedra Imschoot
    email: phaedra.imschoot@gmail.com
    links: []                     # e.g. ["linkedin.com/in/..."]
    # Which contact block to print, chosen by the row's Location.
    # The phone numbers and email below are only a fallback: the Contact
    # section of your Notion profile page wins, so edit them there
    # ("Tel BE: ...", "Tel US: ...", "Mail: ...").
    default_region: be            # used for Remote and anything unlisted
    regions:
      be:
        locations: [Antwerp, Brussels, Ghent, Leuven, "Belgium – other", Paris, Amsterdam]
        location_line: Ghent
        phone: "+32 496 39 46 33"
      us:
        locations: [New York]
        location_line: New York
        phone: "+1 (617) 251 8864"
  fonts: {}                       # optional: drop .ttf files in fonts/ and name them here,
                                  # e.g. {body: Jost-Regular.ttf, body_bold: Jost-SemiBold.ttf}
  branding:
    enabled: true                 # false means one plain house style for every letter
    fallback_accent: "#1F1F1F"    # used when a site gives us nothing
    max_css_bytes: 400000

# ---------------------------------------------------------------------
# QUIET APPLICATIONS: a row you applied to, untouched for this long, with
# no email from the company in that time, is moved to Archived. Silence is
# only read as silence when the mailbox was actually read: if Gmail cannot
# be reached, every company counts as having replied and nothing moves.
# Note that any edit to the row, including one the agent makes, restarts
# the clock.
# ---------------------------------------------------------------------
archive_quiet:
  enabled: false                 # preview with: python main.py --mode quiet --dry-run
  after_days: 14
  statuses: [Applied]            # only these are ever archived
  archive_status: Archived

# ---------------------------------------------------------------------
# LIMITS
# ---------------------------------------------------------------------
limits:
  suggested_per_run: 10          # best matches that become "Suggested" each morning
  min_europe_per_run: 4          # of those, keep at least this many for Belgium and the EU
                                 # when there are enough. Every taste seed is a US company,
                                 # so without a floor the US crowds the top of the list out.
  wildcards_per_run: 3           # extra "Wildcard" roles outside your directions
  min_score_queue: 6.0           # minimum score to land in Notion at all
  min_score_wildcard: 7.0
  min_score_stretch: 9.0         # Paris and Amsterdam need this score
  queue_cap: 30                  # max rows waiting in "Queue"
  queue_expiry_days: 14          # Queue rows older than this go to Notion's trash
  max_posting_age_days: 21
  max_deep_scores_per_run: 40    # cost control: full scores per morning
  max_enrich_per_run: 15         # your own added links filled in per run
  enrich_rows_created_within_days: 10   # only rows you added recently get filled in
  seen_retention_days: 45        # how long a screened posting is remembered
  taste_examples_each: 20        # yes/no examples the scorer sees

weights:                         # must add up to 1.0
  skills_fit: 0.27
  direction_fit: 0.20
  growth_onboarding: 0.15
  taste_match: 0.08              # halved: every seed example is a US company, so this
                                 # quietly rewarded US-shaped roles over Belgian ones
  feasibility: 0.20              # doubled: a role she cannot actually get is worth nothing
  freshness: 0.10

# ---------------------------------------------------------------------
# LOCATIONS: select option name -> words that identify it.
# Order matters: specific cities before "Belgium – other".
# Belgian postings often carry a province or region rather than a town
# ("Oost-Vlaanderen", "Vlaams-Brabant"), and anything unlisted here is
# dropped before scoring, so the catch-all list below is deliberately wide.
# ---------------------------------------------------------------------
locations:
  main:
    New York: [new york, nyc, manhattan, brooklyn, queens, long island city, jersey city, hoboken]
    Antwerp: [antwerp, antwerpen, anvers]
    Brussels: [brussels, brussel, bruxelles, zaventem, diegem, machelen, vilvoorde,
               anderlecht, schaerbeek, schaarbeek, ixelles, elsene, uccle, ukkel, etterbeek,
               evere, jette, laeken, laken, woluwe, auderghem, oudergem, forest, vorst,
               groot-bijgaarden, zellik, asse, ternat, dilbeek, grimbergen, wemmel,
               sint-pieters-leeuw, halle, overijse, tervuren, wavre, waterloo, braine]
    Ghent: [ghent, gent, gand, zwijnaarde, merelbeke, destelbergen, sint-denijs-westrem,
            evergem, lochristi, melle, gentbrugge, ledeberg, drongen, mariakerke]
    Leuven: [leuven, louvain, heverlee, haasrode, kessel-lo, wilsele, herent, bierbeek]
    "Belgium – other":
      # provinces and regions, in both languages
      [belgium, belgië, belgie, belgique, vlaanderen, flanders, flandre,
       wallonia, wallonie, wallonië, oost-vlaanderen, oost vlaanderen, east flanders,
       west-vlaanderen, west vlaanderen, west flanders, flandre occidentale, flandre orientale,
       vlaams-brabant, vlaams brabant, flemish brabant, brabant wallon, waals-brabant,
       limburg, hainaut, henegouwen, liège, liege, luik, namur, namen, brabant,
       # towns and smaller cities
       mechelen, malines, hasselt, bruges, brugge, kortrijk, courtrai, aalst, alost,
       schellebelle, oudenaarde, audenarde, sint-niklaas, saint-nicolas, charleroi, mons,
       bergen, genk, roeselare, roulers, deinze, waregem, izegem, tielt, dendermonde,
       termonde, lier, lierre, turnhout, mol, herentals, geel, kontich, wommelgem,
       edegem, mortsel, boom, puurs, willebroek, beveren, lokeren, eeklo, zele, wetteren,
       ninove, geraardsbergen, ronse, zottegem, aalter, tienen, diest, aarschot,
       sint-truiden, tongeren, beringen, lommel, mouscron, moeskroen, tournai, doornik,
       verviers, eupen, arlon, aarlen, ieper, ypres, veurne, diksmuide, torhout, knokke,
       ostend, oostende, blankenberge, menen, harelbeke, wevelgem, zedelgem, jabbeke]
  stretch:
    Paris: [paris, île-de-france, ile-de-france]
    Amsterdam: [amsterdam]
  remote_option: Remote
  remote_ok_regions: [us, usa, united states, belgium, europe, emea, eu, benelux, new york, anywhere, worldwide]
  europe_options: [Antwerp, Brussels, Ghent, Leuven, "Belgium – other", Paris, Amsterdam]

# ---------------------------------------------------------------------
# HARD FILTERS (free, applied before any AI call). Title patterns are
# matched as whole words and may use simple regex like part[- ]time.
# ---------------------------------------------------------------------
filters:
  max_years_required: 2          # postings that clearly ask for 3+ years are dropped
  # "Not retail" is about the work, not the employer: these are store-floor
  # and store-running titles. Corporate roles at retailers, marketplaces and
  # resale companies stay in (she said yes to Wolf & Badger, Fashionphile,
  # Vivrelle, StockX), so do not add company names here.
  exclude_title_patterns:
    - sales associate
    - sales assistant
    - store manager
    - store supervisor
    - store lead
    - store associate
    - shop assistant
    - retail associate
    - retail assistant
    - retail sales
    - retail manager
    - retail supervisor
    - retail operations
    - store operations
    - stock associate
    - stockroom
    - cashier
    - keyholder
    - key holder
    - client advisor
    - sales advisor
    - brand ambassador
    - boutique
    - visual merchandiser
    - visual merchandising
    - personal shopper
    - stylists?
    - winkelmedewerker
    - winkelbediende
    - winkelverantwoordelijke
    - part[- ]time
    - seasonal
    - freelance
    - designer
    - pattern ?maker
    - seamstress
    - tailor
    - software engineer
    - data scientist
    - machine learning engineer
    - backend
    - front[- ]?end
    - full[- ]?stack
    - devops
    - verkoper
    - verkoopster
    - vendeur
    - vendeuse
    - magazijnier
    - chauffeur
  senior_title_words: [senior, sr, lead, principal, staff, head, director, vp, vice president, chief, general manager]
  internship_title_patterns: [intern, interns, internship, stage, stagiair, stagiaire, summer analyst, summer associate, co-op, werkstudent]
  trainee_title_patterns: [trainee, traineeship, graduate program, graduate programme, graduate scheme, rotational, young graduate, management trainee, leadership development program]

# ---------------------------------------------------------------------
# SEARCH: Adzuna (free API key) covers US, BE, FR and NL.
# SerpApi (Google Jobs) is optional; it only runs if SERPAPI_KEY is set,
# and rotates through its queries a few per day to stay in the free tier.
# ---------------------------------------------------------------------
search:
  adzuna:
    max_days_old: 7
    results_per_query: 20
    countries:
      us:
        where: New York
        terms:
          - client success associate
          - customer success associate
          - partnerships associate
          - business development associate
          - implementation specialist
          - implementation consultant
          - business operations associate
          - product development assistant
          - production coordinator fashion
          - assistant merchandiser
          - allocation analyst
          - assistant buyer
          - showroom coordinator
          - wholesale coordinator
          - fashion tech
          - graduate program
          # PR and communications, fashion first
          - public relations coordinator fashion
          - pr assistant fashion
          - account coordinator public relations
          - communications coordinator fashion
          - press assistant fashion
          - influencer marketing coordinator
          - brand communications assistant
      be:
        where: ""
        terms:
          - customer success
          - implementation consultant
          - junior business analyst
          - partnership manager
          - account manager fashion
          - product development fashion
          - productie coördinator
          - merchandiser
          - aankoper mode
          - graduate programme
          - traineeship
          - junior consultant
          - junior pr
          - communicatie medewerker mode
          - persverantwoordelijke
          - public relations junior
          - pr coördinator
          - communicatie coördinator
          - marketing coördinator mode
          - junior brand manager
          - junior marketeer
          - account coordinator
          - e-commerce coördinator
          - evenementen coördinator
          - junior aankoper
          - starter marketing communicatie
      fr:
        where: Paris
        terms:
          - customer success
          - chef de produit junior mode
          - coordinateur production mode
          - assistant merchandiser
          - business developer luxe
      nl:
        where: Amsterdam
        terms:
          - customer success
          - implementation consultant
          - merchandiser fashion
          - partnerships associate
  serpapi:
    max_queries_per_run: 3
    queries:
      - {q: "fashion tech partnerships associate", location: "New York, New York, United States", gl: us}
      - {q: "fashion product development coordinator", location: "New York, New York, United States", gl: us}
      - {q: "luxury graduate program business", location: "New York, New York, United States", gl: us}
      - {q: "client success fashion platform", location: "New York, New York, United States", gl: us}
      - {q: "junior product developer fashion", location: "Belgium", gl: be}
      - {q: "graduate programme luxury fashion", location: "Belgium", gl: be}
      - {q: "implementation consultant junior", location: "Belgium", gl: be}
      - {q: "coordinateur développement produit maroquinerie", location: "Paris, Ile-de-France, France", gl: fr}
      - {q: "fashion pr agency account coordinator", location: "New York, New York, United States", gl: us}
      - {q: "public relations assistant fashion brand", location: "New York, New York, United States", gl: us}
      - {q: "communications coordinator luxury brand", location: "New York, New York, United States", gl: us}
      - {q: "junior public relations fashion", location: "Belgium", gl: be}
      - {q: "junior marketing communicatie mode", location: "Belgium", gl: be}
      - {q: "fashion brand junior Antwerpen", location: "Belgium", gl: be}
      - {q: "communicatie coördinator merk", location: "Belgium", gl: be}
      - {q: "management trainee België starter", location: "Belgium", gl: be}

# ---------------------------------------------------------------------
# JOB BOARDS: whole boards rather than one company's careers page.
# FashionUnited is the Belgian fashion board. Every Belgian fashion role
# worth applying to so far came from here, while Adzuna's Belgian results
# were mostly generic tech and recruitment.
# ---------------------------------------------------------------------
job_boards:
  fashionunited:
    enabled: true
    base: https://fashionunited.be
    cities: [antwerpen, brussel, gent, brugge, leuven, hasselt, mechelen, kortrijk]
    max_per_city: 20

# ---------------------------------------------------------------------
# WATCHLIST: company job boards read straight from their public feeds.
# Format: board-slug: Display Name. Links already in your Notion DB and
# in the seeds below are added automatically, so this list only needs
# companies you want watched before you've saved one of their jobs.
# ---------------------------------------------------------------------
watchlist:
  greenhouse: {}
  lever: {}
  ashby: {}
  workable: {lyst: Lyst}
  recruitee: {}
  # Teamtailor boards. The key is the careers host (or a bare name for
  # <name>.teamtailor.com). Fashion PR and creative agencies mostly sit here
  # rather than on Greenhouse or Lever.
  # The Independents is the group behind Karla Otto, K2, Bureau Betak, CTZAR,
  # Lefty and others: one feed, many agencies, and tt:division names which.
  teamtailor:
    careers.the-independents.com: The Independents
    careers.karlaotto.com: Karla Otto

# ---------------------------------------------------------------------
# NEWSLETTER / ALERT EMAILS: job links read straight from your mail,
# matched by sender address (only runs if GMAIL_ADDRESS and
# GMAIL_APP_PASSWORD are set). No Gmail label or filter needed: the
# earlier version looked for a label called "Job newsletters" that was
# never created, so this whole source quietly returned nothing.
# Each email is parsed once only (state/seen_emails.json), so the
# lookback can stay wide enough to catch a job board that arrives
# every few weeks. To add a sender: open one of its emails and copy
# the address it came from.
# ---------------------------------------------------------------------
newsletter:
  lookback_days: 35
  max_links: 60
  sources:
    - name: All Things Fashion Tech
      from: allthingsfashiontech+job-board@substack.com
      max_emails: 4          # job board arrives roughly monthly
    - name: LinkedIn job alerts
      from: jobalerts-noreply@linkedin.com
      max_emails: 25         # one email per alert, several a day

# ---------------------------------------------------------------------
# TASTE SEEDS: your first examples, used until Notion has enough
# To Apply / Not interested rows of its own. Their companies are also
# added to the watchlist automatically.
# ---------------------------------------------------------------------
seeds:
  liked:
    - {company: WGSN, title: Client Success Coordinator, url: "https://jobs.lever.co/wgsn/4fc33f6f-a386-4505-a091-47cbafd164d1"}
    - {company: SpreeAI, title: Partnerships & Business Development Associate, url: "https://ats.rippling.com/spreeai/jobs/1e4e2b3f-334a-401e-a569-2ece9d1aab23"}
    - {company: Wolf & Badger, title: Brand Partnerships Associate, url: "https://apply.workable.com/wolfandbadger/j/60543C348E/"}
    - {company: CLO Virtual Fashion, title: 3D Design & Implementation Specialist, url: "https://jobs.lever.co/clovirtualfashion/9185e4c2-91d3-4d46-86e7-86e1b9eeebde"}
    - {company: Bold Metrics, title: Implementation Engineer, url: "https://job-boards.greenhouse.io/boldmetrics/jobs/4696097005"}
    - {company: Vivrelle, title: Associate, Showroom, url: "https://jobs.lever.co/vivrelle/1eea4f74-465b-42b4-b6be-a8420776cfd8"}
    - {company: AfterShip, title: Business Development Representative, url: "https://job-boards.greenhouse.io/aftership/jobs/6130764004"}
    - {company: Fashionphile, title: Customer Experience Analyst, url: ""}
  company_yes_role_too_junior:
    - {company: Wolf & Badger, title: Sales Associate (part-time), url: "https://apply.workable.com/wolfandbadger/j/85E4AB3BCF/"}
    - {company: Alvanon, title: Customer Service Admin, url: "https://alvanon.com/careers/customer-service-admin"}
    - {company: Faume, title: Customer Care Specialist (fixed-term), url: ""}
  watch_only:
    - "https://job-boards.greenhouse.io/stockx"
